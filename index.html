<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>세포의 크기 측정 앱 사용법</title>
  <style>
    :root {
      --ratio: 16 / 9;   /* 영상 비율. 재생 준비되면 실제 값으로 교체됩니다 */
      --chrome: 92px;    /* 제목과 여백이 차지하는 세로 공간 */
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: 12px max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    h1 {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.4rem);
      font-weight: 500;
      text-align: center;
      line-height: 1.3;
    }

    /* 가로 폭과 남은 세로 높이 중 먼저 꽉 차는 쪽에 맞춰 최대한 키웁니다 */
    .video-container {
      width: min(100%, calc((100dvh - var(--chrome)) * (var(--ratio))));
      aspect-ratio: var(--ratio);
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background-color: #000;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.85rem;
      color: #9e9e9e;
    }

    .actions a { color: #9e9e9e; }

    .actions button {
      font: inherit;
      color: #d0d0d0;
      background: transparent;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
    }

    .actions button:hover { border-color: #6a6a6a; color: #ffffff; }
    .actions button:focus-visible { outline: 2px solid #7aa7ff; outline-offset: 2px; }

    /* 휴대폰 가로 모드처럼 세로가 짧을 때는 영상에 공간을 몰아줍니다 */
    @media (orientation: landscape) and (max-height: 500px) {
      :root { --chrome: 44px; }
      body { padding: 6px; gap: 6px; }
      h1 { display: none; }
      .video-container { border-radius: 6px; }
    }

    @media (max-width: 420px) {
      :root { --chrome: 100px; }
      .video-container { border-radius: 8px; }
    }
  </style>
</head>
<body>
  <h1>세포의 크기 측정 앱 사용법</h1>

  <div class="video-container" id="stage">
    <video id="player" controls playsinline preload="metadata">
      <source src="%EC%84%A4%EB%AA%85%EC%84%9C%28KOR%29.mp4" type="video/mp4">
      사용 중인 브라우저가 비디오 태그를 지원하지 않습니다.
    </video>
  </div>

  <div class="actions">
    <button type="button" id="fs">전체화면으로 보기</button>
    <a href="%EC%84%A4%EB%AA%85%EC%84%9C%28KOR%29.mp4" download>영상 내려받기</a>
  </div>

  <script>
    var player = document.getElementById('player');
    var stage = document.getElementById('stage');

    // 영상의 실제 해상도를 읽어 비율을 맞춥니다
    function applyRatio() {
      if (player.videoWidth && player.videoHeight) {
        document.documentElement.style.setProperty(
          '--ratio', player.videoWidth + ' / ' + player.videoHeight
        );
      }
    }
    player.addEventListener('loadedmetadata', applyRatio);
    if (player.readyState >= 1) applyRatio();

    // 전체화면 전환
    document.getElementById('fs').addEventListener('click', function () {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (stage.requestFullscreen) {
        stage.requestFullscreen();
      } else if (player.webkitEnterFullscreen) {
        player.webkitEnterFullscreen(); // iOS 사파리
      }
    });

    // 영상을 두 번 눌러도 전체화면
    player.addEventListener('dblclick', function () {
      if (!document.fullscreenElement && stage.requestFullscreen) stage.requestFullscreen();
      else if (document.fullscreenElement) document.exitFullscreen();
    });
  </script>
</body>
</html>
